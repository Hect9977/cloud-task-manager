spring.application.name=cloud-task-manager
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloud_task_managerDB}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

logging.level.com.cloud_task_manager=${APP_LOG_LEVEL:INFO}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
