<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${errorTitle ?: 'Application Error'}">Application Error</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" th:href="@{/}">Cloud Task Manager</a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="card shadow-sm mx-auto" style="max-width: 700px">
        <div class="card-body p-5 text-center">
          <p
            class="display-4 text-secondary mb-3"
            th:text="${statusCode ?: status ?: 500}"
          >
            500
          </p>
          <h1
            class="h2 mb-3"
            th:text="${errorTitle ?: error ?: 'Application Error'}"
          >
            Application Error
          </h1>
          <p
            class="text-secondary mb-4"
            th:text="${errorMessage ?: message ?: 'The request could not be completed.'}"
          >
            The request could not be completed.
          </p>

          <a class="btn btn-primary me-2" th:href="@{/tasks}">View Tasks</a>
          <a class="btn btn-outline-secondary" th:href="@{/}">Home</a>
        </div>
      </div>
    </main>
  </body>
</html>
