<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task List</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" th:href="@{/}"> Cloud Task Manager </a>

        <div class="navbar-nav">
          <a class="nav-link" th:href="@{/}">Home</a>
          <a class="nav-link active" th:href="@{/tasks}">Tasks</a>
          <a class="nav-link" th:href="@{/tasks/new}">Add Task</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Task List</h1>

        <a class="btn btn-primary" th:href="@{/tasks/new}"> Add New Task </a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-primary">
                <tr>
                  <th>Title</th>
                  <th>Description</th>
                  <th>Due Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr th:if="${#lists.isEmpty(tasks)}">
                  <td colspan="5" class="text-center text-secondary py-4">
                    No tasks have been created.
                  </td>
                </tr>

                <tr th:each="task : ${tasks}">
                  <td th:text="${task.title}"></td>
                  <td th:text="${task.description}"></td>
                  <td th:text="${task.dueDate}"></td>

                  <td>
                    <span class="badge bg-secondary" th:text="${task.status}">
                    </span>
                  </td>

                  <td>
                    <a
                      class="btn btn-sm btn-warning"
                      th:href="@{/tasks/edit/{id}(id=${task.id})}"
                    >
                      Edit
                    </a>

                    <form
                      class="d-inline"
                      th:action="@{/tasks/delete/{id}(id=${task.id})}"
                      method="post"
                    >
                      <button
                        class="btn btn-sm btn-danger"
                        type="submit"
                        onclick="return confirm('Delete this task?');"
                      >
                        Delete
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
