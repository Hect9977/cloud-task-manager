<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud Task Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" th:href="@{/}"> Cloud Task Manager </a>

        <div class="navbar-nav">
          <a class="nav-link active" th:href="@{/}">Home</a>
          <a class="nav-link" th:href="@{/tasks}">Tasks</a>
          <a class="nav-link" th:href="@{/tasks/new}">Add Task</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="p-5 bg-white rounded-3 shadow-sm">
        <h1 class="display-5 fw-bold">Cloud Drive</h1>

        <p class="fs-5 text-secondary">
          Welcome to the Cloud Drive! Create, view, update, and delete tasks!
        </p>

        <a class="btn btn-primary btn-lg me-2" th:href="@{/tasks}">
          View Tasks
        </a>

        <a class="btn btn-outline-primary btn-lg" th:href="@{/tasks/new}">
          Add New Task
        </a>
      </div>
    </main>
  </body>
</html>
