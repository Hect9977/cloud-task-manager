<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" th:href="@{/}"> Cloud Task Manager </a>

        <div class="navbar-nav">
          <a class="nav-link" th:href="@{/}">Home</a>
          <a class="nav-link" th:href="@{/tasks}">Tasks</a>
          <a class="nav-link active" th:href="@{/tasks/new}">Add Task</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="card shadow-sm mx-auto" style="max-width: 700px">
        <div class="card-body p-4">
          <h1
            class="mb-4"
            th:text="${task.id == null ? 'Add Task' : 'Edit Task'}"
          >
            Task Form
          </h1>

          <form th:action="@{/tasks/save}" th:object="${task}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label for="title" class="form-label">Title</label>

              <input
                id="title"
                class="form-control"
                type="text"
                maxlength="100"
                required
                th:field="*{title}"
                th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
              />

              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('title')}"
                th:errors="*{title}"
              ></div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label"> Description </label>

              <textarea
                id="description"
                class="form-control"
                rows="4"
                maxlength="500"
                th:field="*{description}"
                th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
              >
              </textarea>

              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}"
              ></div>
            </div>

            <div class="mb-3">
              <label for="dueDate" class="form-label">Due Date</label>

              <input
                id="dueDate"
                class="form-control"
                type="date"
                required
                th:field="*{dueDate}"
                th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid'"
              />

              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('dueDate')}"
                th:errors="*{dueDate}"
              ></div>
            </div>

            <div class="mb-4">
              <label for="status" class="form-label">Status</label>

              <select
                id="status"
                class="form-select"
                required
                th:field="*{status}"
                th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'"
              >
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>

              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('status')}"
                th:errors="*{status}"
              ></div>
            </div>

            <button class="btn btn-primary" type="submit">Save Task</button>

            <a class="btn btn-secondary" th:href="@{/tasks}"> Cancel </a>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
