name: Activity 6 - Build Test and Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-task-manager-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  EB_APPLICATION: My_AWS_Application
  EB_ENVIRONMENT: MyAWSApplication-env-1
  DEPLOY_BUCKET: elasticbeanstalk-us-east-2-325212745459
  VERSION_LABEL: activity6-${{ github.run_id }}-${{ github.run_attempt }}
  AWS_PAGER: ""

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build application and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Sign in to AWS
        id: aws-login
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::325212745459:role/cst323-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: activity6-${{ github.run_id }}

      - name: Upload application JAR to S3
        run: |
          aws s3api put-object \
            --bucket "$DEPLOY_BUCKET" \
            --key "activity6/${VERSION_LABEL}.jar" \
            --body target/cloud-task-manager-0.0.1-SNAPSHOT.jar

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --description "Activity 6 GitHub commit ${GITHUB_SHA}" \
            --source-bundle "S3Bucket=${DEPLOY_BUCKET},S3Key=activity6/${VERSION_LABEL}.jar"

      - name: Deploy to existing AWS environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION_LABEL"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT"

      - name: Verify deployed version and application health
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYED_VERSION=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].VersionLabel" \
            --output text)

          if [ "$DEPLOYED_VERSION" != "$VERSION_LABEL" ]; then
            echo "Deployment verification failed."
            echo "Expected: $VERSION_LABEL"
            echo "Actual: $DEPLOYED_VERSION"
            exit 1
          fi

          APP_HOST=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].CNAME" \
            --output text)

          curl --fail --silent --show-error \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "http://${APP_HOST}/actuator/health"

          echo
          echo "Deployment verified: http://${APP_HOST}"

      - name: Show AWS events if deployment fails
        if: failure() && steps.aws-login.outcome == 'success'
        run: |
          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --max-records 15 \
            --query "Events[*].[EventDate,Severity,Message]" \
            --output table
